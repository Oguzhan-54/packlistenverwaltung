<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Packliste anlegen</title>
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>
    <header>
        <a href="index.html" class="logo">Packlistenverwaltung</a>
        <nav>
            <a href="index.html">Übersicht</a>
            <a href="archiv.html">Archiv</a>
        </nav>
        <div class="benutzer">
            <span id="benutzername"></span>
            <button id="logout">Logout</button>
        </div>
    </header>
    <main>
        <div class="formular-karte">
            <div>
                <label for="name">Name</label>
                <input type="text" id="name">
            </div>
            <div>
                <label for="jobnummer">Jobnummer</label>
                <input type="text" id="jobnummer">
            </div>
            <div>
                <label for="startDatum">Start</label>
                <input type="date" id="startDatum">
            </div>
            <div>
                <label for="endDatum">Ende</label>
                <input type="date" id="endDatum">
            </div>
            <button id="packliste-anlegen">+ Packliste anlegen</button>
        </div>

        <p id="fehlermeldung" hidden>Packliste konnte nicht angelegt werden. Alle Felder ausfüllen und Jobnummer prüfen.</p>
        
    </main>

    <script src="./js/login-pruefen.js"></script>
    <script src="./js/packliste-anlegen.js"></script>
</body>
</html>
